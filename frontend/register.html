<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Maintain AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="logo">
                <span class="logo-mark">M</span>
                <span>Maintain<span class="logo-ai">AI</span></span>
            </a>

            <div class="auth-heading">

                <h1>Create your account</h1>

                <p>
                    Start using AI-powered maintenance intelligence.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full name
                    </label>

                    <input type="text" id="fullName" placeholder="Enter your full name" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input type="email" id="email" placeholder="you@example.com" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>

                </div>


                <div id="registerError" class="auth-error"></div>


                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
